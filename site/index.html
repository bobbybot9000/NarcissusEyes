<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700;12..96,800&family=DM+Mono:wght@400;500&display=swap">

<style>
  :root {
    --paper: #E8EEF2;
    --ink:   #0F1519;
    --ink-2: #55636D;
    --ink-3: #8996A1;
    --iris:  #16323F;
    --link:  #2E6F8E;
    --disp:  "Bricolage Grotesque", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono:  "DM Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--disp);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  a { color: var(--link); }
  a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px; border-radius: 4px; }

  /* The eyes own the right half and bleed off the edge. */
  #eyes {
    position: fixed;
    top: 0;
    right: 0;
    width: 52vw;
    height: 100%;
    display: block;
    z-index: 0;
    pointer-events: none;
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 34px;
    max-width: 1180px;
    margin: 0 auto;
    padding: 72px 40px;
  }
  .col { max-width: 30ch; display: flex; flex-direction: column; gap: 30px; align-items: flex-start; }

  .mark {
    display: flex; align-items: center; gap: 9px;
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-2);
  }
  .mark span { font-size: 16px; line-height: 1; }

  h1 { margin: 0; font-weight: 800; letter-spacing: -0.032em; line-height: 0.93; }
  h1 .a { display: block; font-size: clamp(40px, 6.6vw, 82px); }
  h1 .b { display: block; font-size: clamp(27px, 4.3vw, 53px); color: var(--ink-2); letter-spacing: -0.024em; }
  h1 .c { display: block; font-size: clamp(20px, 2.9vw, 36px); color: var(--ink-3); letter-spacing: -0.018em; }

  .what { margin: 0; font-size: clamp(16.5px, 1.6vw, 18.5px); color: var(--ink-2); max-width: 34ch; }

  .dl {
    display: inline-flex; align-items: center; gap: 11px;
    background: var(--ink); color: var(--paper);
    padding: 15px 30px; border-radius: 999px;
    font-weight: 700; font-size: 16.5px; text-decoration: none;
    min-height: 52px;
    transition: transform .14s ease, background .14s ease;
  }
  .dl:hover { background: var(--link); color: #fff; transform: translateY(-1px); }
  .dl:active { transform: translateY(0); }

  .meta {
    font-family: var(--mono); font-size: 12px; color: var(--ink-3);
    display: flex; flex-direction: column; gap: 4px;
    margin-top: -18px;
  }
  .meta a { color: var(--ink-3); }

  @media (max-width: 860px) {
    #eyes { position: absolute; width: 100%; height: 42vh; top: 0; right: 0; }
    .page { justify-content: flex-start; padding: calc(42vh + 28px) 24px 56px; gap: 28px; }
    .col { max-width: none; }
    .dl { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>

<canvas id="eyes"></canvas>

<main class="page">
  <div class="col">
    <p class="mark"><span>👀</span> LookNice</p>

    <h1>
      <span class="a">LOOK AT YOURSELF</span>

    <p class="what">A tiny mirror of your webcam, parked right under the lens. Your eyes go to it — which happens to be exactly where the camera is.</p>

  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var canvas = document.getElementById('eyes');
  if (!canvas || typeof THREE === 'undefined') return;

  var scene = new THREE.Scene();
  // Orthographic: a perspective lens this wide stretches spheres near the
  // edges into eggs, and these need to stay round to read as 👀.
  // Half-extents of the pair, used to frame it at any aspect. Slightly under
  // the true width so the outer edges bleed a little past the frame.
  var PAIR_W = 5.3, PAIR_H = 3.0;
  var camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
  camera.position.set(0, 0, 40);

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

  scene.add(new THREE.AmbientLight(0xffffff, 0.78));
  var key = new THREE.DirectionalLight(0xffffff, 0.62);
  key.position.set(-5, 7, 10);
  scene.add(key);
  var fill = new THREE.DirectionalLight(0xbcd4e2, 0.4);
  fill.position.set(7, -5, 6);
  scene.add(fill);

  // Iris and pupil are spherical CAPS, not flat discs: a disc sized to fit the
  // eyeball hides inside it, and one sized to clear it floats off the surface.
  // Built around +Y, so rotated to face +Z.
  var gSclera = new THREE.SphereGeometry(1, 64, 48);

  var gIris = new THREE.SphereGeometry(1.004, 64, 28, 0, Math.PI * 2, 0, 0.56);
  gIris.rotateX(Math.PI / 2);

  var gGlint = new THREE.SphereGeometry(0.115, 20, 20);

  var mSclera = new THREE.MeshStandardMaterial({ color: 0xfdfefe, roughness: 0.30, metalness: 0.0 });
  var mIris   = new THREE.MeshStandardMaterial({ color: 0x16323f, roughness: 0.22, metalness: 0.08 });
  var mGlint  = new THREE.MeshBasicMaterial({ color: 0xffffff });

  function makeEye(scale) {
    var g = new THREE.Group();

    // Slightly taller than wide, like the emoji.
    var sclera = new THREE.Mesh(gSclera, mSclera);
    sclera.scale.set(0.88, 1, 0.88);
    g.add(sclera);

    g.add(new THREE.Mesh(gIris, mIris));

    var glint = new THREE.Mesh(gGlint, mGlint);
    glint.position.set(-0.21, 0.25, 0.94);
    g.add(glint);

    g.scale.setScalar(scale);
    return g;
  }

  // One pair. The emoji has a slightly smaller left eye, so keep that.
  var pair = new THREE.Group();
  var left  = makeEye(2.55);
  var right = makeEye(2.78);
  left.position.set(-2.75, 0.18, 0);
  right.position.set(2.75, 0, 0.3);
  pair.add(left, right);
  scene.add(pair);
  var eyes = [left, right];

  // FAR is a normal gaze; NEAR is close enough that aiming both eyes at the
  // same point forces them to converge — that IS the cross-eye, no special
  // per-eye maths needed. ~29 degrees inward at the pair's spacing.
  var FAR = 26, NEAR = 5.0;
  var want = new THREE.Vector3(0, 0, FAR);
  var look = new THREE.Vector3(0, 0, FAR);
  var pointerSeen = false;

  function ndc(clientX, clientY) {
    var r = canvas.getBoundingClientRect();
    return {
      x: ((clientX - r.left) / r.width) * 2 - 1,
      y: -(((clientY - r.top) / r.height) * 2 - 1)
    };
  }

  // How far into the gap between the eyes the pointer is, 0..1.
  function crossing(nx, ny) {
    var wx = nx * camera.right, wy = ny * camera.top;
    if (Math.abs(wy) > 3.2) return 0;
    return 1 - Math.min(1, Math.abs(wx) / 1.4);
  }

  function aim(clientX, clientY) {
    var n = ndc(clientX, clientY);
    want.set(n.x * 13, n.y * 8, FAR - crossing(n.x, n.y) * (FAR - NEAR));
    pointerSeen = true;
  }

  // Which eye is under the pointer, if any. The spheres are wider than they
  // are tall by the same 0.88 the sclera is squashed by, so test an ellipse.
  function eyeUnder(nx, ny) {
    for (var i = 0; i < eyes.length; i++) {
      var e = eyes[i];
      var c = e.position.clone().project(camera);
      var dx = (nx - c.x) / ((e.userData.base * 0.88) / camera.right);
      var dy = (ny - c.y) / (e.userData.base / camera.top);
      if (dx * dx + dy * dy <= 1) return e;
    }
    return null;
  }

  // Listen on the window, not the canvas — it's pointer-events: none so the
  // copy beneath it stays selectable.
  window.addEventListener('pointermove', function (e) { aim(e.clientX, e.clientY); }, { passive: true });
  window.addEventListener('pointerdown', function (e) {
    aim(e.clientX, e.clientY);
    var n = ndc(e.clientX, e.clientY);
    var hit = eyeUnder(n.x, n.y);
    if (hit) blink(hit, performance.now());
  }, { passive: true });

  function resize() {
    var r = canvas.getBoundingClientRect();
    var w = Math.round(r.width), h = Math.round(r.height);
    if (!w || !h) return;
    renderer.setSize(w, h, false);
    // Frame the pair whichever way the canvas is shaped — tall and narrow
    // beside the copy on desktop, short and wide above it on a phone.
    var aspect = w / h;
    var halfH = Math.max(PAIR_H, PAIR_W / aspect) * 1.06;
    var halfW = halfH * aspect;
    camera.left = -halfW; camera.right = halfW;
    camera.top = halfH;   camera.bottom = -halfH;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(canvas);
  requestAnimationFrame(resize);
  resize();

  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var BLINK = 155;
  eyes.forEach(function (e, i) {
    e.userData.base = e.scale.x;
    e.userData.next = performance.now() + 2000 + Math.random() * 4000;
    e.userData.start = -1;
    // Bulge: an underdamped spring, so it overshoots and settles rather than
    // easing in. The two eyes use slightly different stiffness so the pair
    // swells raggedly instead of in lockstep.
    e.userData.bulge = 1;
    e.userData.bv = 0;
    e.userData.bk = i === 0 ? 0.15 : 0.185;
  });
  var bulgeTarget = 1;

  function blink(e, t) {
    if (e.userData.start >= 0) return;   // already mid-blink
    e.userData.start = t;
  }

  // Anticipation on the download button: the eyes widen just before you commit.
  var dl = document.querySelector('.dl');
  if (dl && !reduced) {
    var swell = function () { bulgeTarget = 1.08; };
    var settle = function () { bulgeTarget = 1; };
    dl.addEventListener('pointerenter', swell);
    dl.addEventListener('pointerleave', settle);
    dl.addEventListener('focus', swell);
    dl.addEventListener('blur', settle);
  }

  function frame(t) {
    // Before the pointer shows up (and on touch) drift on a slow figure.
    if (!pointerSeen) {
      want.set(Math.sin(t / 3000) * 9, Math.cos(t / 4200) * 5, 26);
    }
    look.lerp(want, 0.10);

    for (var i = 0; i < eyes.length; i++) {
      var e = eyes[i];
      e.lookAt(look);

      if (!reduced) {
        var d = e.userData;
        if (d.start < 0 && t >= d.next) d.start = t;

        var squash = 1;
        if (d.start >= 0) {
          var p = (t - d.start) / BLINK;
          if (p >= 1) {
            d.start = -1;
            // Blink together, roughly, the way a real pair does.
            d.next = t + 2600 + Math.random() * 4200;
          } else {
            squash = 1 - Math.sin(p * Math.PI) * 0.93;
          }
        }

        d.bv += (bulgeTarget - d.bulge) * d.bk;
        d.bv *= 0.74;
        d.bulge += d.bv;

        var w = d.base * d.bulge;
        e.scale.set(w, w * squash, w);
      }
    }

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
